body{font-family:'Noto Sans Devanagari',sans-serif;background:#f0f4f8}

.hospital-card{background:white;border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,0.06);border-left:4px solid #00c853}
.hospital-name{font-weight:700;font-size:14px}
.hospital-meta{font-size:11px;color:#718096;display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.meta-tag{background:#edf2f7;padding:2px 8px;border-radius:4px}
.call-btn{background:linear-gradient(135deg,#006400,#00a000);color:white;width:100%;padding:10px;border:none;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer}

const DISTRICTS = [...new Set(HOSPITALS.map(h=>h.district))].sort();
let currentDistrict="Akola"; let currentType="All"; let currentDoctor="All"; let currentSearch="";
const districtSelect=document.getElementById('districtSelect');
DISTRICTS.forEach(d=>{let o=document.createElement('option');o.value=d;o.textContent=d;if(d==="Akola")o.selected=true;districtSelect.appendChild(o);});
districtSelect.addEventListener('change',e=>{currentDistrict=e.target.value;doSearch();});
document.getElementById('talukaInput').addEventListener('input',e=>{currentSearch=e.target.value.toLowerCase();doSearch();});
function filterType(t,el){currentType=t;document.querySelectorAll('#typeFilters .filter-chip').forEach(c=>c.classList.remove('active'));el.classList.add('active');doSearch();}
function filterDoctor(d,el){currentDoctor=d;document.querySelectorAll('#doctorFilters .doctor-chip').forEach(c=>c.classList.remove('active'));el.classList.add('active');doSearch();}
function doSearch(){
 let filtered=HOSPITALS;
 if(currentDistrict) filtered=filtered.filter(h=>h.district===currentDistrict);
 if(currentType!=="All") filtered=filtered.filter(h=>h.type===currentType);
 if(currentDoctor!=="All") filtered=filtered.filter(h=>h.specialty===currentDoctor);
 if(currentSearch) filtered=filtered.filter(h=>h.name_en.toLowerCase().includes(currentSearch)||h.name_mr.includes(currentSearch)||h.taluka.toLowerCase().includes(currentSearch));
 document.getElementById('resultText').textContent=filtered.length+" दवाखाने सापडले - "+(currentDistrict||'संपूर्ण महाराष्ट्र');
 document.getElementById('totalShow').textContent="एकूण "+HOSPITALS.length;
 renderHospitals(filtered.slice(0,100));
}
function renderHospitals(list){
 const container=document.getElementById('hospitalList');
 if(list.length===0){container.innerHTML='<div style="text-align:center;padding:30px;color:#718096">कोणतेही दवाखाने सापडले नाहीत</div>';return;}
 container.innerHTML=list.map(h=>`
  <div class="hospital-card">
   <div class="distance">${(Math.random()*15+0.3).toFixed(1)} km</div>
   <div class="hospital-name">${h.name_mr}</div>
   <div style="font-size:12px;color:#4a5568">${h.name_en}</div>
   <div class="hospital-meta"><span>📍 ${h.taluka}</span><span class="meta-tag">⏰ ${h.timing}</span><span class="meta-tag">${h.specialty}</span><span class="meta-tag">${h.type}</span></div>
   <button class="call-btn" onclick="window.location.href='tel:${h.phone}'">📞 कॉल करा / Call : ${h.phone}</button>
  </div>`).join('');
}
doSearch();
document.getElementById('totalCount').textContent=HOSPITALS.length;
