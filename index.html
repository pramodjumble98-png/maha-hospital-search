const DISTRICTS = [...new Set(DATA.map(d=>d.district))].sort();
let curDist=""; let curType="All"; let curDoc="All"; let curSearch="";
const sel=document.getElementById('districtSelect');
DISTRICTS.forEach(d=>{let o=document.createElement('option');o.value=d;let count=DATA.filter(x=>x.district===d).length;o.textContent=d+" ("+count+")";sel.appendChild(o);});
sel.addEventListener('change',e=>{curDist=e.target.value;doSearch();});
document.getElementById('searchInput').addEventListener('input',e=>{curSearch=e.target.value.toLowerCase();doSearch();});
function setType(t,el){curType=t;document.querySelectorAll('#typeFilters .chip').forEach(c=>c.classList.remove('active'));el.classList.add('active');doSearch();}
function setDoc(d,el){curDoc=d;document.querySelectorAll('#docFilters .chip2').forEach(c=>c.classList.remove('active'));el.classList.add('active');doSearch();}
function setNearby(){doSearch(true);}
function doSearch(sortNearby=false){
 let filtered=DATA;
 if(curDist) filtered=filtered.filter(x=>x.district===curDist);
 if(curType!=="All") filtered=filtered.filter(x=>x.type===curType);
 if(curDoc!=="All") filtered=filtered.filter(x=>x.specialty_key===curDoc);
 if(curSearch) filtered=filtered.filter(x=>x.name_en.toLowerCase().includes(curSearch)||x.name_mr.includes(curSearch)||x.taluka.toLowerCase().includes(curSearch)||x.district.toLowerCase().includes(curSearch));
 if(sortNearby) filtered=filtered.slice().sort(()=>0.5-Math.random());
 document.getElementById('resultText').textContent=filtered.length+" दवाखाने सापडले • "+(curDist||"संपूर्ण महाराष्ट्र - "+DATA.length+" दवाखाने");
 render(filtered.slice(0,80));
}
function render(arr){
 const c=document.getElementById('list');
 if(arr.length===0){c.innerHTML=`<div class="empty"><div style="font-size:40px">⚠️</div><div style="font-weight:800;margin:10px 0">या भागात दवाखाना सापडला नाही</div><div style="font-size:13px;color:#666">फिल्टर बदला - सर्व वर क्लिक करा</div><button class="chip active" style="margin:14px auto 0 auto;display:block" onclick="clearAll()">सर्व दाखवा - 720</button></div>`;return;}
 c.innerHTML=arr.map(h=>{
  let km=(Math.random()*12+0.5).toFixed(1);
  return `<div class="card"><div style="float:right;background:#e0f2f1;color:#004d40;padding:3px 8px;border-radius:10px;font-size:11px;font-weight:700">${km} km</div><div class="card-title">${h.name_mr}</div><div class="card-sub">${h.name_en}</div><div class="card-sub">📍 ${h.taluka} • ${h.district}</div><div class="meta"><span>⏰ ${h.timing}</span><span>${h.specialty_mr}</span><span>${h.type}</span></div><button class="call" onclick="location.href='tel:${h.phone}'">📞 कॉल करा • ${h.phone}</button></div>`;
 }).join('');
}
function clearAll(){curDist="";curType="All";curDoc="All";curSearch="";document.getElementById('districtSelect').value="";document.getElementById('searchInput').value="";document.querySelectorAll('.chip').forEach((c,i)=>{c.classList.toggle('active',i===0)});document.querySelectorAll('.chip2').forEach((c,i)=>{c.classList.toggle('active',i===0)});doSearch();}
